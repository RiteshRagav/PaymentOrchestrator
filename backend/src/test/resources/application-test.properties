# Test profile — H2 in-memory, zero latency gateways
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Zero latency in tests to keep them fast
gateway.a.enabled=true
gateway.a.failure-rate=0.20
gateway.a.latency-ms=0
gateway.a.priority=1

gateway.b.enabled=true
gateway.b.failure-rate=0.10
gateway.b.latency-ms=0
gateway.b.priority=2

gateway.c.enabled=true
gateway.c.failure-rate=0.05
gateway.c.latency-ms=0
gateway.c.priority=3

payment.router.max-attempts=3
cors.allowed-origins=http://localhost:5173
