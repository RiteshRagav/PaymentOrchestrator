# ============================================================
# Payment Orchestrator — Main Application Configuration
# ============================================================
# For local development: activate the 'dev' profile to use H2 instead of PostgreSQL
#   Windows: set SPRING_PROFILES_ACTIVE=dev
#   Or pass: --spring.profiles.active=dev
# ============================================================

# Server
server.port=${PORT:8080}

# ============================================================
# Database (PostgreSQL — used in Docker / Production)
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentdb}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# Gateway Configuration
# ============================================================

# Gateway A — highest priority, moderate failure rate
gateway.a.enabled=true
gateway.a.failure-rate=0.20
gateway.a.latency-ms=500
gateway.a.priority=1

# Gateway B — second priority, lower failure rate
gateway.b.enabled=true
gateway.b.failure-rate=0.10
gateway.b.latency-ms=800
gateway.b.priority=2

# Gateway C — final fallback, most reliable (lowest failure rate)
gateway.c.enabled=true
gateway.c.failure-rate=0.05
gateway.c.latency-ms=300
gateway.c.priority=3

# ============================================================
# Payment Router
# ============================================================
# Maximum number of gateway attempts before giving up
payment.router.max-attempts=3

# ============================================================
# CORS
# ============================================================
# Set CORS_ALLOWED_ORIGINS to your deployed frontend URL in production
# Multiple origins: comma-separated
# Example: https://my-app.vercel.app,https://my-app-preview.vercel.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# Springdoc / Swagger
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ============================================================
# Logging
# ============================================================
logging.level.com.ritesh.paymentorchestrator=INFO
logging.level.org.hibernate.SQL=WARN
