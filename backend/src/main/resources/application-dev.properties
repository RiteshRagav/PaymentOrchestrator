# ============================================================
# Development Profile — Uses H2 in-memory database
# ============================================================
# Activate with: --spring.profiles.active=dev
# or set environment variable: SPRING_PROFILES_ACTIVE=dev
# ============================================================

spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Verbose logging for dev
logging.level.com.ritesh.paymentorchestrator=DEBUG
logging.level.org.hibernate.SQL=DEBUG
