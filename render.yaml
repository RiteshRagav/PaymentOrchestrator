databases:
  - name: payment-orchestrator-db
    plan: free
    databaseName: payment_orchestrator
    user: payment_user

services:
  - type: web
    name: payment-orchestrator-backend
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payment-orchestrator-db
          property: jdbcConnectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
